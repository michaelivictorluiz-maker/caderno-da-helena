<!doctype html>

<head>
<meta charset="utf-8">

<meta property="og:image" content="https://caderno-da-helena.vercel.app/img/tomas-avatar.webp">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#1F4E8C;--azul2:#2A62A8;--amarelo:#FFD43F;--laranja:#F07A1A;--txt:#F4F1EA;--sub:#C9D3E3;--card:#0B1322;--borda:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--txt);background:#070C16;
  background-image:radial-gradient(120% 60% at 50% 0%,#1F4E8C 0%,#0E2246 45%,#070C16 85%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px 48px;text-align:center}
.avatar{width:112px;height:112px;border-radius:50%;border:3px solid var(--amarelo);box-shadow:0 8px 30px rgba(0,0,0,.45);display:block;margin:0 auto 16px}
h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.bio{margin:10px auto 0;max-width:400px;font-size:17px;line-height:1.45;color:var(--sub)}
.bio b{color:var(--txt)}
.icons{display:flex;justify-content:center;gap:26px;margin:22px 0 30px}
.icons a{color:var(--txt);opacity:.9;transition:opacity .2s,transform .2s}
.icons a:hover{opacity:1;transform:translateY(-2px)}
.icons svg{width:30px;height:30px;display:block}
.links{display:flex;flex-direction:column;gap:14px}
.btn{position:relative;display:flex;align-items:center;gap:14px;min-height:76px;padding:10px 16px 10px 10px;
  background:var(--card);border:1px solid var(--borda);border-radius:16px;color:var(--txt);text-decoration:none;
  transition:transform .15s,border-color .2s,background .2s}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,212,63,.45);background:#0F1A2E}
.btn .ic{width:56px;height:56px;flex:0 0 56px;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.btn .ic img{width:100%;height:100%;object-fit:cover}
.btn .tx{flex:1;text-align:left;font-weight:700;font-size:16px;line-height:1.3}
.btn .tx small{display:block;font-weight:500;font-size:13.5px;color:var(--sub);margin-top:3px}
.btn .seta{opacity:.5;font-size:20px}
.btn.destaque{border:1.5px solid var(--amarelo);background:linear-gradient(135deg,#13284A,#0B1322);min-height:96px}
.btn.destaque .ic{width:60px;height:84px;flex-basis:60px;border-radius:6px;background:#fff}
.tag{position:absolute;top:-10px;left:18px;background:var(--amarelo);color:#1B1B1B;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.tt{background:#000}
.ic svg{width:30px;height:30px;color:#fff}
footer{margin-top:34px;font-size:12.5px;color:rgba(201,211,227,.55)}
@media (max-width:380px){h1{font-size:25px}.bio{font-size:16px}}
</style>
</head>
<body>
<main class="wrap">
  <img class="avatar" src="/img/tomas-avatar.webp" alt="Tomás" width="112" height="112">
  <h1>Histórias do Tomás</h1>
  <p class="bio">Fala Baixinho: um prédio em silêncio. <b>Eles ouvem tudo.</b> 🤫<br>Sobrevivias? ⬇️</p>

  <nav class="icons" aria-label="Redes">

    </a>
        <a href="https://www.tiktok.com/@histrias.do.toms" target="_blank" rel="noopener" aria-label="TikTok">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.3 2.2 1.6 3.6 3.9 3.8v3.1c-1.4.1-2.6-.3-3.9-1.1v5.9c0 7.4-8.1 9.7-11.3 4.4-2.1-3.4-.8-9.3 6-9.6v3.3c-.5.1-1.1.2-1.6.4-1.5.5-2.4 1.5-2.2 3.2.5 3.3 6.5 4.3 6-2.2V3h3.1z"/></svg>
    </a>
  </nav>

  <div class="links">
    <a class="btn destaque" href="/?utm_source=bio&amp;utm_medium=linkbio&amp;utm_campaign=links_tomas&amp;utm_content=botao_caderno">
      <span class="tag">Da série</span>
      <span class="ic"><img src="/img/capa-mini.webp" alt="" width="60" height="84"></span>
      <span class="tx">O Caderno da Helena<small>As 8 regras da série para usar em casa</small></span>
      <span class="seta">›</span>

    <a class="btn" href="https://www.instagram.com/historiasdotomas/" target="_blank" rel="noopener">

      <span class="tx">Todos os episódios<small>no Instagram</small></span>
      <span class="seta">›</span>
    </a>

        <a class="btn" href="https://www.tiktok.com/@histrias.do.toms" target="_blank" rel="noopener">
      <span class="ic tt"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.3 2.2 1.6 3.6 3.9 3.8v3.1c-1.4.1-2.6-.3-3.9-1.1v5.9c0 7.4-8.1 9.7-11.3 4.4-2.1-3.4-.8-9.3 6-9.6v3.3c-.5.1-1.1.2-1.6.4-1.5.5-2.4 1.5-2.2 3.2.5 3.3 6.5 4.3 6-2.2V3h3.1z"/></svg></span>
      <span class="tx">TikTok<small>Episódios no TikTok</small></span>

    </a>
  </div>

  <footer>Histórias do Tomás · série de ficção</footer>
</main>
</body>
</html>
